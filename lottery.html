<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>年会抽奖 · 南郊势力</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
  <link href="https://fonts.loli.net/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@300;400;500;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0c;
      --ink-2: #101014;
      --ink-3: #141419;
      --line: #26262d;
      --paper: #f2ecdf;
      --ash: #9b958a;
      --red: #d6362b;
      --red-deep: #8e1f1a;
      --gold: #c9a254;
      --font-display: "ZCOOL QingKe HuangYou", "Microsoft YaHei", sans-serif;
      --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-util: "Oswald", "Arial Narrow", sans-serif;
      --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, rgba(214, 54, 43, 0.14), transparent 60%), var(--ink);
      color: var(--paper);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) clamp(18px, 4vw, 40px) 60px; }
    header.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
    header.bar h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); letter-spacing: 3px; }
    header.bar h1 em { font-style: normal; color: var(--red); }
    header.bar .sub { font-family: var(--font-util); font-size: 12px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; }

    .panel { background: var(--ink-2); border: 1px solid var(--line); padding: clamp(16px, 3vw, 26px); }
    .panel + .panel { margin-top: 18px; }

    /* 奖项名额与名单加载 */
    .cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .cfg label { display: block; font-size: 13px; color: var(--ash); margin-bottom: 6px; letter-spacing: 1px; }
    .cfg input[type="number"] {
      width: 100%; background: var(--ink-3); border: 1px solid var(--line); color: var(--paper);
      font-family: var(--font-util); font-size: 22px; padding: 8px 12px;
    }
    .cfg input:focus { outline: none; border-color: var(--gold); }
    .load-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    .status { font-size: 14px; color: var(--ash); }
    .status b { color: var(--gold); font-family: var(--font-util); font-size: 18px; }

    /* 奖级选择 */
    .tiers { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .tier {
      flex: 1 1 150px; cursor: pointer; text-align: center; padding: 14px 10px;
      background: var(--ink-3); border: 1px solid var(--line);
      transition: border-color 0.25s, background 0.25s, transform 0.2s var(--ease-out);
    }
    .tier:hover { transform: translateY(-2px); }
    .tier .t-name { font-family: var(--font-display); font-size: 24px; letter-spacing: 2px; }
    .tier .t-left { font-family: var(--font-util); font-size: 13px; color: var(--gold); margin-top: 4px; letter-spacing: 1px; }
    .tier.active { border-color: var(--red); background: rgba(214, 54, 43, 0.12); }
    .tier.done { opacity: 0.4; cursor: not-allowed; }

    /* 抽奖舞台 */
    .stage { text-align: center; padding: clamp(20px, 4vw, 40px) 10px; }
    .roll {
      min-height: 150px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; align-items: center;
    }
    .name-chip {
      font-family: var(--font-display); font-size: clamp(22px, 4vw, 40px); letter-spacing: 2px;
      color: var(--gold); border: 1px solid rgba(201, 162, 84, 0.45); padding: 10px 22px;
      background: var(--ink-3);
    }
    .name-chip.win { color: #fff6e8; background: var(--red); border-color: var(--red); animation: pop 0.45s var(--ease-out) both; }
    @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .stage .hint { margin-top: 16px; color: var(--ash); font-size: 14px; letter-spacing: 1px; }

    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    button { font: inherit; cursor: pointer; }
    .btn {
      font-family: var(--font-display); font-size: 20px; letter-spacing: 4px;
      padding: 14px 44px; border: none;
    }
    .btn--go { background: var(--red); color: #fff8ee; }
    .btn--go:hover { background: #e8493c; }
    .btn--go:disabled { background: #4a2a27; color: #8a7d78; cursor: not-allowed; }
    .btn--ghost { background: none; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); font-size: 16px; letter-spacing: 2px; padding: 12px 26px; }
    .btn--ghost:hover { color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper); }
    .btn--danger { background: none; color: var(--ash); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; letter-spacing: 2px; padding: 12px 26px; }
    .btn--danger:hover { color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }

    /* 结果榜 */
    .result-group { margin-bottom: 18px; }
    .result-group h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px; }
    .result-group h3 small { font-family: var(--font-util); color: var(--ash); font-size: 12px; letter-spacing: 2px; margin-left: 8px; }
    .winners { display: flex; flex-wrap: wrap; gap: 8px; }
    .winners span {
      background: var(--ink-3); border: 1px solid var(--line); padding: 6px 14px;
      font-size: 15px; letter-spacing: 1px;
    }
    .g1 .winners span { border-color: rgba(201, 162, 84, 0.6); color: #ffe9b8; }
    .g2 .winners span { color: var(--paper); }
    .g3 .winners span { color: var(--ash); }

    /* 手动名单输入（名单文件加载失败时显示） */
    textarea {
      width: 100%; min-height: 120px; background: var(--ink-3); border: 1px solid var(--line);
      color: var(--paper); font-family: var(--font-body); font-size: 15px; line-height: 1.9; padding: 12px;
      margin-top: 12px;
    }
    textarea:focus { outline: none; border-color: var(--gold); }
    .hidden { display: none !important; }

    footer.note { margin-top: 26px; color: #606068; font-size: 12px; letter-spacing: 1px; text-align: center; font-family: var(--font-util); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <h1>年会抽奖 · <em>南郊势力</em></h1>
      <span class="sub">Annual Lucky Draw · Internal</span>
    </header>

    <!-- 奖项设置 -->
    <section class="panel cfg">
      <div class="cfg-grid">
        <div><label>一等奖名额</label><input type="number" id="q1" min="0" max="50" value="2"></div>
        <div><label>二等奖名额</label><input type="number" id="q2" min="0" max="50" value="5"></div>
        <div><label>三等奖名额</label><input type="number" id="q3" min="0" max="50" value="10"></div>
        <div><label>每轮抽取人数</label><input type="number" id="per" min="1" max="20" value="5"></div>
      </div>
      <div class="load-row">
        <button class="btn btn--ghost" id="btn-reload" type="button">重新载入名单</button>
        <button class="btn btn--ghost" id="btn-paste" type="button">手动粘贴名单</button>
        <span class="status" id="pool-status">奖池：<b id="pool-count">0</b> 人</span>
      </div>
      <textarea id="paste-area" class="hidden" placeholder="一行一个名字，粘贴后点击「用这份名单」"></textarea>
      <div class="load-row hidden" id="paste-row">
        <button class="btn btn--ghost" id="btn-use-paste" type="button">用这份名单</button>
      </div>
    </section>

    <!-- 抽奖 -->
    <section class="panel">
      <div class="tiers" id="tiers"></div>
      <div class="stage">
        <div class="roll" id="roll"><span class="hint" style="letter-spacing:2px;">选好奖级，点「开始抽奖」——好运降临</span></div>
        <div class="actions">
          <button class="btn btn--go" id="btn-go" type="button">开 始 抽 奖</button>
          <button class="btn btn--ghost" id="btn-copy" type="button">复制中奖名单</button>
          <button class="btn btn--danger" id="btn-reset" type="button">全部重来</button>
        </div>
        <p class="hint" id="stage-hint">名单文件：data/lottery-names.txt（一行一个名字）</p>
      </div>
    </section>

    <!-- 结果 -->
    <section class="panel" id="results">
      <div class="result-group g1 hidden"><h3>一等奖<small id="r1-t"></small><div class="winners" id="r1"></div></h3></div>
      <div class="result-group g2 hidden"><h3>二等奖<small id="r2-t"></small><div class="winners" id="r2"></div></h3></div>
      <div class="result-group g3 hidden"><h3>三等奖<small id="r3-t"></small><div class="winners" id="r3"></div></h3></div>
      <p class="status" id="empty-hint">还没有人中奖——好事将近。</p>
    </section>

    <footer class="note">NANJIAO SHILI · ANNUAL PARTY · 仅限年会现场使用</footer>
  </div>

  <script>
  (function () {
    "use strict";
    var TIERS = [
      { key: "1", name: "一等奖", cls: "g1" },
      { key: "2", name: "二等奖", cls: "g2" },
      { key: "3", name: "三等奖", cls: "g3" }
    ];
    var LS_KEY = "njsl-lottery-v1";
    var els = {
      q1: document.getElementById("q1"),
      q2: document.getElementById("q2"),
      q3: document.getElementById("q3"),
      per: document.getElementById("per"),
      poolStatus: document.getElementById("pool-status"),
      tiers: document.getElementById("tiers"),
      roll: document.getElementById("roll"),
      go: document.getElementById("btn-go"),
      copy: document.getElementById("btn-copy"),
      reset: document.getElementById("btn-reset"),
      reload: document.getElementById("btn-reload"),
      paste: document.getElementById("btn-paste"),
      pasteArea: document.getElementById("paste-area"),
      pasteRow: document.getElementById("paste-row"),
      usePaste: document.getElementById("btn-use-paste"),
      stageHint: document.getElementById("stage-hint"),
      empty: document.getElementById("empty-hint")
    };

    /* 状态：奖池 + 各奖级中奖者；进度存 localStorage，刷新不丢 */
    var state = load() || { pool: [], won: { "1": [], "2": [], "3": [] } };
    var activeTier = "3"; /* 默认从三等奖开始抽 */
    var rolling = false;

    function quotas() {
      return {
        "1": Math.max(0, parseInt(els.q1.value, 10) || 0),
        "2": Math.max(0, parseInt(els.q2.value, 10) || 0),
        "3": Math.max(0, parseInt(els.q3.value, 10) || 0)
      };
    }
    function load() {
      try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; }
    }
    function save() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    }
    function parseNames(text) {
      return text.split(/\r?\n/)
        .map(function (s) { return s.trim(); })
        .filter(function (s) { return s && s.charAt(0) !== "#"; });
    }
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    /* ---------- 名单载入 ---------- */
    function fetchNames(cb) {
      fetch("data/lottery-names.txt", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("http " + r.status);
          return r.text();
        })
        .then(function (t) { cb(parseNames(t), null); })
        .catch(function () { cb(null, "名单文件读取失败"); });
    }
    function startPool(names) {
      state.pool = names.slice();
      state.won = { "1": [], "2": [], "3": [] };
      save();
      renderAll();
    }
    els.reload.addEventListener("click", function () {
      if (!confirm("重新载入名单会清空当前进度，确定？")) return;
      fetchNames(function (names, err) {
        if (err) { els.stageHint.textContent = "读取失败：可点「手动粘贴名单」"; return; }
        startPool(names);
        els.stageHint.textContent = "已载入 " + names.length + " 人（data/lottery-names.txt）";
      });
    });
    els.paste.addEventListener("click", function () {
      els.pasteArea.classList.remove("hidden");
      els.pasteRow.classList.remove("hidden");
      els.pasteArea.focus();
    });
    els.usePaste.addEventListener("click", function () {
      var names = parseNames(els.pasteArea.value);
      if (!names.length) { alert("名单是空的：一行一个名字"); return; }
      if (!confirm("使用这份名单会清空当前进度，确定？")) return;
      els.pasteArea.classList.add("hidden");
      els.pasteRow.classList.add("hidden");
      startPool(names);
      els.stageHint.textContent = "已载入手动名单 " + names.length + " 人";
    });

    /* ---------- 渲染 ---------- */
    function renderTiers() {
      var q = quotas();
      els.tiers.innerHTML = "";
      TIERS.forEach(function (t) {
        var left = q[t.key] - state.won[t.key].length;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tier" + (activeTier === t.key ? " active" : "") + (left <= 0 ? " done" : "");
        b.innerHTML = '<div class="t-name">' + t.name + '</div><div class="t-left">剩 ' + Math.max(0, left) + " / " + q[t.key] + "</div>";
        b.addEventListener("click", function () {
          if (left <= 0) return;
          activeTier = t.key;
          renderTiers();
        });
        els.tiers.appendChild(b);
      });
    }
    function renderPool() {
      var q = quotas();
      var totalWon = state.won["1"].length + state.won["2"].length + state.won["3"].length;
      els.poolStatus.innerHTML = "奖池：<b>" + state.pool.length + "</b> 人 · 已中：<b>" + totalWon + "</b> 人";
    }
    function renderResults() {
      var any = false;
      TIERS.forEach(function (t) {
        var box = document.getElementById("r" + t.key);
        var group = box.closest(".result-group");
        if (state.won[t.key].length) {
          any = true;
          group.classList.remove("hidden");
          document.getElementById("r" + t.key + "-t").textContent = state.won[t.key].length + " / " + quotas()[t.key];
          box.innerHTML = state.won[t.key].map(function (n) { return "<span>" + n + "</span>"; }).join("");
        } else {
          group.classList.add("hidden");
        }
      });
      els.empty.classList.toggle("hidden", any);
    }
    function renderAll() { renderTiers(); renderPool(); renderResults(); }

    /* ---------- 抽奖 ---------- */
    els.go.addEventListener("click", function () {
      if (rolling) return;
      if (!state.pool.length) { alert("奖池空了：先载入名单"); return; }
      var q = quotas();
      var left = q[activeTier] - state.won[activeTier].length;
      if (left <= 0) { alert("该奖级已抽完，换一个"); return; }
      var per = Math.max(1, Math.min(20, parseInt(els.per.value, 10) || 1));
      var take = Math.min(per, left, state.pool.length);

      rolling = true;
      els.go.disabled = true;
      els.roll.innerHTML = "";
      var chips = [];
      for (var i = 0; i < take; i++) {
        var c = document.createElement("span");
        c.className = "name-chip";
        els.roll.appendChild(c);
        chips.push(c);
      }

      var ticks = 0, total = 42;
      var timer = setInterval(function () {
        chips.forEach(function (c) {
          c.textContent = state.pool[Math.floor(Math.random() * state.pool.length)];
        });
        ticks++;
        if (ticks >= total) {
          clearInterval(timer);
          var winners = shuffle(state.pool.slice()).slice(0, take);
          winners.forEach(function (n, idx) {
            state.pool.splice(state.pool.indexOf(n), 1);
            state.won[activeTier].push(n);
            chips[idx].textContent = n;
            chips[idx].classList.add("win");
          });
          save();
          rolling = false;
          els.go.disabled = false;
          renderAll();
        }
      }, 70);
    });

    /* ---------- 复制 / 重置 ---------- */
    els.copy.addEventListener("click", function () {
      var lines = ["【南郊势力·年会抽奖结果】"];
      TIERS.forEach(function (t) {
        if (state.won[t.key].length) {
          lines.push(t.name + "：" + state.won[t.key].join("、"));
        }
      });
      var text = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { alert("已复制，可直接粘贴到群里公示"); },
          function () { fallbackCopy(text); }
        );
      } else { fallbackCopy(text); }
      function fallbackCopy(s) {
        var ta = document.createElement("textarea");
        ta.value = s; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); alert("已复制"); } catch (e) { alert("复制失败，请手动截图"); }
        document.body.removeChild(ta);
      }
    });
    els.reset.addEventListener("click", function () {
      if (!confirm("清空全部中奖记录、重置奖池？")) return;
      state.won = { "1": [], "2": [], "3": [] };
      fetchNames(function (names) {
        state.pool = names ? names.slice() : [];
        save();
        renderAll();
        els.stageHint.textContent = names ? "已重置（" + names.length + " 人）" : "重置失败，请手动粘贴名单";
      });
    });

    /* ---------- 启动 ---------- */
    fetchNames(function (names, err) {
      if (state.pool.length) {
        renderAll();
        els.stageHint.textContent = "已恢复上次进度 · 剩余 " + state.pool.length + " 人（「全部重来」可重置）";
      } else if (names && names.length) {
        startPool(names);
        els.stageHint.textContent = "已载入 " + names.length + " 人（data/lottery-names.txt）";
      } else {
        renderAll();
        els.stageHint.textContent = "名单文件读取失败：点「手动粘贴名单」输入";
        els.pasteArea.classList.remove("hidden");
        els.pasteRow.classList.remove("hidden");
      }
    });
    [els.q1, els.q2, els.q3, els.per].forEach(function (inp) {
      inp.addEventListener("change", renderAll);
    });
  })();
  </script>
</body>
</html>
