<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请函批量生成 · 南郊势力 2026 年会</title>
  <meta name="description" content="上传名单 txt（每行一个名字），批量生成南郊势力2026年会邀请函图片：可选文件夹直接保存，或打包 ZIP 下载。">
  <meta name="theme-color" content="#0a0a0c">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="大秦军团 · 南郊势力">
  <meta property="og:title" content="邀请函批量生成 · 南郊势力 2026 年会">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
  <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gala.css?v=5">
</head>
<body data-page="batch">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <!-- ====== 顶栏（独立页） ====== -->
  <header class="gala-header">
    <div class="container gala-header-inner">
      <a class="gala-brand" href="2026.html" aria-label="南郊势力 2026 年会">
        <span class="marks">
          <img src="images/logo/daqin.png" alt="大秦军团会徽">
          <span class="sep" aria-hidden="true"></span>
          <img src="images/logo/nanjiaoshili.png" alt="南郊势力徽标">
        </span>
        <span class="gala-brand-text">
          <b>大秦军团 · 南郊势力</b>
          <small>2026 ANNUAL GALA</small>
        </span>
      </a>
      <nav class="gala-nav" aria-label="批量页导航">
        <a href="index.html">官网</a>
        <a class="btn btn--primary btn--sm" href="invite2.html">单张生成</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- ====== 页头 ====== -->
    <section class="page-hero page-hero--tight">
      <span class="hero-watermark" aria-hidden="true">批</span>
      <div class="container">
        <p class="crumbs">Batch · 批量生成</p>
        <h1>一份名单，<em>人手一张邀请函</em></h1>
        <p class="lead">上传名单 txt（每行一个名字，逗号分隔也可），一次生成全部邀请函：电脑可选拯救文件夹直接保存，其他设备打包 ZIP 下载。</p>
      </div>
    </section>

    <!-- ====== 批量生成 ====== -->
    <section class="section section--tight">
      <div class="container">
        <div class="batch-panel reveal">
          <div class="batch-row">
            <div class="field">
              <label for="batch-file">上传名单 txt · Names File</label>
              <input type="file" id="batch-file" accept=".txt,text/plain">
            </div>
            <div class="field">
              <label for="batch-text">或粘贴名单 · Paste</label>
              <textarea id="batch-text" rows="6" placeholder="每行一个名字&#10;例：&#10;李洪涛&#10;王勇&#10;袁慧"></textarea>
            </div>
          </div>
          <div class="batch-actions-row">
            <button class="btn btn--ghost btn--sm" type="button" id="batch-parse">识别名单</button>
            <span id="batch-count" class="batch-count" aria-live="polite"></span>
          </div>
          <div class="batch-list" id="batch-list" aria-label="已识别名单"></div>

          <div class="batch-run-row">
            <label class="batch-mode">
              保存方式
              <select id="batch-mode">
                <option value="dir">保存到文件夹（电脑端，可选目录）</option>
                <option value="zip">打包 ZIP 下载（通用）</option>
              </select>
            </label>
            <button class="btn btn--primary" type="button" id="batch-run" disabled>批量生成</button>
            <button class="btn btn--ghost btn--sm" type="button" id="batch-zip" disabled>仅打包 ZIP</button>
          </div>

          <div class="batch-bar" id="batch-bar" style="display:none;">
            <div class="batch-bar-fill" id="batch-bar-fill"></div>
            <span class="batch-bar-text" id="batch-bar-text"></span>
          </div>

          <p class="invite-tip">文件夹模式：点击后选择（或新建）目标文件夹，图片将逐张写入；ZIP 模式：生成后自动下载一个压缩包。</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ====== 页脚（独立页） ====== -->
  <footer class="gala-footer">
    <div class="container">
      <div class="gf-marks">
        <img src="images/logo/daqin.png" alt="大秦军团会徽">
        <span class="sep" aria-hidden="true"></span>
        <img src="images/logo/nanjiaoshili.png" alt="南郊势力徽标">
      </div>
      <img class="gf-script" src="images/logo/daqin-script-logo.png" alt="大秦军团">
      <p class="gf-line">大秦军团南郊势力战斗组 · 2026 年会</p>
      <nav class="gf-links" aria-label="页脚导航">
        <a href="2026.html">年会主页</a>
        <a href="invite2.html">单张邀请函</a>
        <a href="poster.html">介绍海报</a>
        <a href="index.html">返回官网</a>
      </nav>
      <p class="gf-cr">© 2026 南郊势力战斗组 · For The Team · Always</p>
    </div>
  </footer>

  <div class="toast" role="status" aria-live="polite"></div>
  <script src="js/gala.js?v=4"></script>
  <script src="js/invite2.js?v=2"></script>
  <script src="js/batch.js?v=2"></script>
</body>
</html>
